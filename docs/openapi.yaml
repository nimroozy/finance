        priority:
          $ref: '#/components/schemas/AssignmentPriority'
        due_date:
          type: string
          format: date
        notes: { type: string }

    AutoPreviewAssignmentRequest:
      type: object
      required: [branch_id]
      properties:
        branch_id:
          type: integer
          description: Must be within authenticated user's allowed branches
        strategy:
          type: string
          enum: [round_robin, least_loaded]
        customer_ids:
          type: array
          items: { type: integer }
        collector_ids:
          type: array
          items: { type: integer }

    ReassignAssignmentRequest:
      type: object
      required: [collector_id]
      properties:
        collector_id: { type: integer }
        priority:
          $ref: '#/components/schemas/AssignmentPriority'
        due_date:
          type: string
          format: date
        notes: { type: string }

    VisitOutcomeCode:
      type: string
      enum:
        - customer_met
