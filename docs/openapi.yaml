        branch_id: { type: integer }
        route_stop_id: { type: integer, nullable: true }
        visited_at:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/VisitOutcomeCode'
        notes: { type: string, nullable: true }
        contact_status: { type: string, nullable: true }
        person_met: { type: string, nullable: true }
        follow_up_required: { type: boolean }
        follow_up_date:
          type: string
          format: date
          nullable: true
        escalation_flag: { type: boolean }
        origin:
          type: string
          enum: [online, offline]
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        gps_accuracy: { type: number, nullable: true }
        gps_permission_state:
          type: string
          enum: [granted, denied, unavailable, prompt]
          nullable: true
        gps_source: { type: string, nullable: true }
        gps_captured_at:
          type: string
          format: date-time
          nullable: true
        gps_risk_level:
          type: string
          enum: [ok, warning, high_risk]
          nullable: true
        distance_meters: { type: number, nullable: true }
        correction_note: { type: string, nullable: true }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVisitRequest:
      type: object
      required: [outcome]
      properties:
        customer_id:
          type: integer
          description: Required when assignment_id is omitted
        assignment_id: { type: integer, nullable: true }
        collector_id: { type: integer, nullable: true }
        route_stop_id: { type: integer, nullable: true }
        visited_at:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/VisitOutcomeCode'
        notes: { type: string }
        contact_status: { type: string, maxLength: 100 }
        person_met: { type: string, maxLength: 255 }
        follow_up_required: { type: boolean }
        follow_up_date:
          type: string
          format: date
        escalation_flag: { type: boolean }
        origin:
          type: string
          enum: [online, offline]
        latitude: { type: number }
        longitude: { type: number }
        gps_accuracy: { type: number }
        gps_permission_state:
          type: string
          enum: [granted, denied, unavailable, prompt]
        gps_source: { type: string, maxLength: 50 }
        gps_captured_at:
          type: string
          format: date-time
        device_info: { type: string, maxLength: 500 }
        promise:
          type: object
          properties:
            amount:
              type: number
              minimum: 0
              exclusiveMinimum: true
            promised_date:
              type: string
              format: date
            currency:
              type: string
              minLength: 3
              maxLength: 3
            notes: { type: string }
            allow_past_date: { type: boolean }

