components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: "Laravel Sanctum personal access token (`Authorization: Bearer {token}`)."

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: user
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    BranchId:
      name: branch_id
      in: query
      description: |
        Optional filter only. Not trusted as an authorization grant; accessible
        branches are resolved from the authenticated user.
      schema: { type: integer }
    Search:
      name: search
      in: query
      schema: { type: string }
    ExportCsv:
      name: export
      in: query
      description: Set to `csv` to download CSV instead of JSON.
      schema:
        type: string
        enum: [csv]

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaginatedGeneric:
      description: Paginated list
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: {}
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data: {}
        meta:
          type: object
          additionalProperties: true
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Empty object `{}` when no field errors
        data:
          type: object
          nullable: true
          additionalProperties: true

    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
      description: HTTP 401 — missing/invalid token or bad credentials
      example:
        success: false
        message: Invalid credentials.
        errors: {}

    ForbiddenError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
      description: HTTP 403 — authenticated but lacking permission or out of branch/collector scope
      example:
        success: false
        message: This action is unauthorized.
        errors: {}

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
      description: HTTP 422 — request validation failed
      example:
        success: false
        message: The given data was invalid.
        errors:
          login:
            - The login field is required.

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    HealthData:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, error]
            redis:
              type: string
              enum: [ok, error]

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Email or username
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 255
          default: api-token

    ChangePasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          description: Min 12 chars; mixed case, numbers, and symbols required
        password_confirmation:
          type: string
          format: password

    LoginResponseData:
      type: object
      properties:
        token: { type: string }
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'
        force_password_change: { type: boolean }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        locale:
          type: string
          enum: [en, fa]
        status: { type: string }
        force_password_change: { type: boolean }
        last_login_at:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        branches:
          type: array
          items:
            $ref: '#/components/schemas/UserBranch'

    UserBranch:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name_en: { type: string }
        name_fa: { type: string, nullable: true }

    StoreUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        locale:
          type: string
          enum: [en, fa]
        password: { type: string, format: password }
        force_password_change: { type: boolean }
        roles:
          type: array
          items: { type: string }
        branch_ids:
          type: array
          items: { type: integer }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        locale:
          type: string
          enum: [en, fa]
        password: { type: string, format: password }
        force_password_change: { type: boolean }
        roles:
          type: array
          items: { type: string }
        branch_ids:
          type: array
          items: { type: integer }

    CompanySettings:
      type: object
      properties:
        company_name: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        timezone: { type: string, nullable: true }
        setup_completed: { type: string, nullable: true }

    AssignmentStatus:
      type: string
      enum:
        - assigned
        - accepted
        - in_progress
        - closed
        - cancelled
        - reassigned
        - fully_resolved

    AssignmentPriority:
      type: string
      enum: [low, normal, high, urgent]

    Assignment:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        collector_id: { type: integer }
        branch_id: { type: integer }
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        priority:
          $ref: '#/components/schemas/AssignmentPriority'
        is_active: { type: boolean }
        due_date:
          type: string
          format: date
          nullable: true
        planned_visit_date:
          type: string
          format: date
          nullable: true
        notes: { type: string, nullable: true }
        manager_notes: { type: string, nullable: true }
        collector_instructions: { type: string, nullable: true }
        assignment_reason: { type: string, nullable: true }
        accepted_at:
          type: string
          format: date-time
          nullable: true
        viewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        customer:
          type: object
          additionalProperties: true
        collector:
          type: object
          additionalProperties: true
        branch:
          type: object
          additionalProperties: true

    AssignmentHistory:
      type: object
      properties:
        id: { type: integer }
        customer_assignment_id: { type: integer }
        event: { type: string }
        from_status: { type: string, nullable: true }
        to_status: { type: string, nullable: true }
        changed_by: { type: integer, nullable: true }
        meta:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateAssignmentRequest:
      type: object
      required: [customer_id, collector_id]
      properties:
        customer_id: { type: integer }
        collector_id: { type: integer }
        priority:
          $ref: '#/components/schemas/AssignmentPriority'
        due_date:
          type: string
          format: date
        planned_visit_date:
          type: string
          format: date
        notes: { type: string }
        manager_notes: { type: string }
        collector_instructions: { type: string }
        assignment_reason: { type: string, maxLength: 500 }

    BulkAssignmentRequest:
      type: object
      required: [customer_ids, collector_id]
      properties:
        customer_ids:
          type: array
          minItems: 1
          items: { type: integer }
        collector_id: { type: integer }
        branch_id:
          type: integer
