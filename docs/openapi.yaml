components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: "Laravel Sanctum personal access token (`Authorization: Bearer {token}`)."

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: user
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    BranchId:
      name: branch_id
      in: query
      description: |
        Optional filter only. Not trusted as an authorization grant; accessible
        branches are resolved from the authenticated user.
      schema: { type: integer }
    Search:
      name: search
      in: query
      schema: { type: string }
    ExportCsv:
      name: export
      in: query
      description: Set to `csv` to download CSV instead of JSON.
      schema:
        type: string
        enum: [csv]

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaginatedGeneric:
      description: Paginated list
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: {}
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data: {}
        meta:
          type: object
          additionalProperties: true
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Empty object `{}` when no field errors
        data:
          type: object
          nullable: true
          additionalProperties: true

    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
      description: HTTP 401 — missing/invalid token or bad credentials
      example:
        success: false
        message: Invalid credentials.
        errors: {}

    ForbiddenError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
      description: HTTP 403 — authenticated but lacking permission or out of branch/collector scope
      example:
        success: false
        message: This action is unauthorized.
        errors: {}

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
      description: HTTP 422 — request validation failed
      example:
        success: false
        message: The given data was invalid.
        errors:
          login:
            - The login field is required.

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    HealthData:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, error]
            redis:
              type: string
              enum: [ok, error]

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Email or username
        password:
          type: string
          format: password
        device_name:
          type: string
          maxLength: 255
          default: api-token

    ChangePasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          description: Min 12 chars; mixed case, numbers, and symbols required
        password_confirmation:
          type: string
          format: password

    LoginResponseData:
      type: object
      properties:
        token: { type: string }
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'
        force_password_change: { type: boolean }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        locale:
          type: string
          enum: [en, fa]
        status: { type: string }
        force_password_change: { type: boolean }
        last_login_at:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        branches:
          type: array
          items:
            $ref: '#/components/schemas/UserBranch'

    UserBranch:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name_en: { type: string }
        name_fa: { type: string, nullable: true }

    StoreUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        locale:
          type: string
          enum: [en, fa]
        password: { type: string, format: password }
        force_password_change: { type: boolean }
        roles:
          type: array
          items: { type: string }
        branch_ids:
          type: array
          items: { type: integer }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        locale:
          type: string
          enum: [en, fa]
        password: { type: string, format: password }
        force_password_change: { type: boolean }
        roles:
          type: array
          items: { type: string }
        branch_ids:
          type: array
          items: { type: integer }

    CompanySettings:
      type: object
      properties:
        company_name: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        timezone: { type: string, nullable: true }
        setup_completed: { type: string, nullable: true }

    AssignmentStatus:
      type: string
      enum:
        - assigned
        - accepted
        - in_progress
        - closed
        - cancelled
        - reassigned
        - fully_resolved

    AssignmentPriority:
      type: string
      enum: [low, normal, high, urgent]

    Assignment:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        collector_id: { type: integer }
        branch_id: { type: integer }
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        priority:
          $ref: '#/components/schemas/AssignmentPriority'
        is_active: { type: boolean }
        due_date:
          type: string
          format: date
          nullable: true
        planned_visit_date:
          type: string
          format: date
          nullable: true
        notes: { type: string, nullable: true }
        manager_notes: { type: string, nullable: true }
        collector_instructions: { type: string, nullable: true }
        assignment_reason: { type: string, nullable: true }
        accepted_at:
          type: string
          format: date-time
          nullable: true
        viewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        customer:
          type: object
          additionalProperties: true
        collector:
          type: object
          additionalProperties: true
        branch:
          type: object
          additionalProperties: true

    AssignmentHistory:
      type: object
      properties:
        id: { type: integer }
        customer_assignment_id: { type: integer }
        event: { type: string }
        from_status: { type: string, nullable: true }
        to_status: { type: string, nullable: true }
        changed_by: { type: integer, nullable: true }
        meta:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateAssignmentRequest:
      type: object
      required: [customer_id, collector_id]
      properties:
        customer_id: { type: integer }
        collector_id: { type: integer }
        priority:
          $ref: '#/components/schemas/AssignmentPriority'
        due_date:
          type: string
          format: date
        planned_visit_date:
          type: string
          format: date
        notes: { type: string }
        manager_notes: { type: string }
        collector_instructions: { type: string }
        assignment_reason: { type: string, maxLength: 500 }

    BulkAssignmentRequest:
      type: object
      required: [customer_ids, collector_id]
      properties:
        customer_ids:
          type: array
          minItems: 1
          items: { type: integer }
        collector_id: { type: integer }
        branch_id:
          type: integer
          description: Optional filter/hint only; access still from auth context
        priority:
          $ref: '#/components/schemas/AssignmentPriority'
        due_date:
          type: string
          format: date
        notes: { type: string }

    AutoPreviewAssignmentRequest:
      type: object
      required: [branch_id]
      properties:
        branch_id:
          type: integer
          description: Must be within authenticated user's allowed branches
        strategy:
          type: string
          enum: [round_robin, least_loaded]
        customer_ids:
          type: array
          items: { type: integer }
        collector_ids:
          type: array
          items: { type: integer }

    ReassignAssignmentRequest:
      type: object
      required: [collector_id]
      properties:
        collector_id: { type: integer }
        priority:
          $ref: '#/components/schemas/AssignmentPriority'
        due_date:
          type: string
          format: date
        notes: { type: string }

    VisitOutcomeCode:
      type: string
      enum:
        - customer_met
        - not_available
        - not_home
        - no_answer
        - phone_unreachable
        - wrong_address
        - customer_moved
        - refused
        - disputed_balance
        - promise_to_pay
        - requested_manager
        - requested_cancellation
        - requested_review
        - business_closed
        - follow_up
        - other

    VisitOutcome:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/VisitOutcomeCode'
        label_en: { type: string }
        label_fa: { type: string }

    Visit:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        assignment_id: { type: integer, nullable: true }
        collector_id: { type: integer }
        branch_id: { type: integer }
        route_stop_id: { type: integer, nullable: true }
        visited_at:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/VisitOutcomeCode'
        notes: { type: string, nullable: true }
        contact_status: { type: string, nullable: true }
        person_met: { type: string, nullable: true }
        follow_up_required: { type: boolean }
        follow_up_date:
          type: string
          format: date
          nullable: true
        escalation_flag: { type: boolean }
        origin:
          type: string
          enum: [online, offline]
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        gps_accuracy: { type: number, nullable: true }
        gps_permission_state:
          type: string
          enum: [granted, denied, unavailable, prompt]
          nullable: true
        gps_source: { type: string, nullable: true }
        gps_captured_at:
          type: string
          format: date-time
          nullable: true
        gps_risk_level:
          type: string
          enum: [ok, warning, high_risk]
          nullable: true
        distance_meters: { type: number, nullable: true }
        correction_note: { type: string, nullable: true }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVisitRequest:
      type: object
      required: [outcome]
      properties:
        customer_id:
          type: integer
          description: Required when assignment_id is omitted
        assignment_id: { type: integer, nullable: true }
        collector_id: { type: integer, nullable: true }
        route_stop_id: { type: integer, nullable: true }
        visited_at:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/VisitOutcomeCode'
        notes: { type: string }
        contact_status: { type: string, maxLength: 100 }
        person_met: { type: string, maxLength: 255 }
        follow_up_required: { type: boolean }
        follow_up_date:
          type: string
          format: date
        escalation_flag: { type: boolean }
        origin:
          type: string
          enum: [online, offline]
        latitude: { type: number }
        longitude: { type: number }
        gps_accuracy: { type: number }
        gps_permission_state:
          type: string
          enum: [granted, denied, unavailable, prompt]
        gps_source: { type: string, maxLength: 50 }
        gps_captured_at:
          type: string
          format: date-time
        device_info: { type: string, maxLength: 500 }
        promise:
          type: object
          properties:
            amount:
              type: number
              minimum: 0
              exclusiveMinimum: true
            promised_date:
              type: string
              format: date
            currency:
              type: string
              minLength: 3
              maxLength: 3
            notes: { type: string }
            allow_past_date: { type: boolean }

    RouteStatus:
      type: string
      enum: [draft, published, in_progress, completed, cancelled]

    RouteStop:
      type: object
      properties:
        id: { type: integer }
        collection_route_id: { type: integer }
        customer_id: { type: integer }
        assignment_id: { type: integer, nullable: true }
        sequence: { type: integer }
        notes: { type: string, nullable: true }
        status: { type: string, nullable: true }

    CollectionRoute:
      type: object
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        collector_id: { type: integer }
        name: { type: string }
        route_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/RouteStatus'
        notes: { type: string, nullable: true }
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        stops:
          type: array
          items:
            $ref: '#/components/schemas/RouteStop'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRouteRequest:
      type: object
      required: [branch_id, collector_id, name, route_date]
      properties:
        branch_id:
          type: integer
          description: Must be within authenticated user's allowed branches
        collector_id: { type: integer }
        name: { type: string, maxLength: 255 }
        route_date:
          type: string
          format: date
        notes: { type: string }
        stops:
          type: array
          items:
            type: object
            required: [customer_id]
            properties:
              customer_id: { type: integer }
              assignment_id: { type: integer, nullable: true }
              sequence: { type: integer, minimum: 1 }
              notes: { type: string }

    UpdateRouteRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        route_date:
          type: string
          format: date
        notes: { type: string, nullable: true }
        collector_id: { type: integer }
        stops:
          type: array
          items:
            type: object
            required: [customer_id]
            properties:
              customer_id: { type: integer }
              assignment_id: { type: integer, nullable: true }
              sequence: { type: integer, minimum: 1 }
              notes: { type: string }

    PromiseStatus:
      type: string
      enum:
        - active
        - due_soon
        - due_today
        - overdue
        - fulfilled
        - partially_fulfilled
        - cancelled
        - superseded

    PromiseToPay:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        assignment_id: { type: integer, nullable: true }
        visit_id: { type: integer, nullable: true }
        collector_id: { type: integer, nullable: true }
        branch_id: { type: integer }
        amount:
          type: number
          format: float
        currency: { type: string }
        promised_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/PromiseStatus'
        notes: { type: string, nullable: true }
        fulfilled_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePromiseRequest:
      type: object
      required: [customer_id, amount, promised_date]
      properties:
        customer_id: { type: integer }
        assignment_id: { type: integer, nullable: true }
        visit_id: { type: integer, nullable: true }
        collector_id: { type: integer, nullable: true }
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
        promised_date:
          type: string
          format: date
        notes: { type: string }
        allow_past_date: { type: boolean }

    SupersedePromiseRequest:
      type: object
      required: [amount, promised_date]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        promised_date:
          type: string
          format: date
        currency:
          type: string
          minLength: 3
          maxLength: 3
        notes: { type: string }
        allow_past_date: { type: boolean }

    CollectorDashboard:
      type: object
      properties:
        collector_id: { type: integer }
        active_assignments: { type: integer }
        visits_today: { type: integer }
        open_promises: { type: integer }
        routes_today:
          type: array
          items:
            $ref: '#/components/schemas/CollectionRoute'

    PaymentDraftRequest:
      type: object
      required: [customer_id, payment_method_id, amount, allocations, idempotency_key]
      properties:
        customer_id: { type: integer }
        collector_id: { type: integer, nullable: true }
        payment_method_id: { type: integer }
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        allocations:
          type: array
          minItems: 1
          items:
            type: object
            required: [invoice_id, amount]
            properties:
              invoice_id: { type: integer }
              amount:
                type: number
                exclusiveMinimum: true
                minimum: 0
        external_reference: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        visit_id: { type: integer, nullable: true }
        promise_id: { type: integer, nullable: true }
        idempotency_key: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }

    TicketCreateRequest:
      type: object
      required: [branch_id, type_code, subject]
      properties:
        branch_id: { type: integer }
        type_code: { type: string }
        subject: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        source:
          type: string
          enum: [manual, whatsapp, phone_call, customer_portal, sales, finance, noc, technical, monitoring, installation, radius, email_future, api, internal]
        priority:
          type: string
          enum: [low, normal, medium, high, urgent, critical]
        severity:
          type: string
          enum: [individual_customer, multiple_customers, neighborhood, tower, branch, network_wide]
        customer_id: { type: integer, nullable: true }
        customer_number: { type: string, nullable: true }
        customer_phone: { type: string, nullable: true }
        customer_location: { type: string, nullable: true }
        assigned_department_id: { type: integer, nullable: true }
        assigned_team_id: { type: integer, nullable: true }
        primary_assignee_id: { type: integer, nullable: true }
        whatsapp_conversation_id: { type: integer, nullable: true }
        category: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        external_reference: { type: string, nullable: true }

    TicketUpdateRequest:
      type: object
      properties:
        subject: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        priority:
          type: string
          enum: [low, normal, medium, high, urgent, critical]
        severity:
          type: string
          enum: [individual_customer, multiple_customers, neighborhood, tower, branch, network_wide]
        category: { type: string, nullable: true }
        assigned_department_id: { type: integer, nullable: true }
        assigned_team_id: { type: integer, nullable: true }
        internal_notes: { type: string, nullable: true }
        customer_visible_notes: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }

    TaskCreateRequest:
      type: object
      required: [branch_id, title]
      properties:
        branch_id: { type: integer }
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        type: { type: string, enum: [field, office] }
        priority: { type: string }
        ticket_id: { type: integer, nullable: true }
        installation_id: { type: integer, nullable: true }
        assignee_id: { type: integer, nullable: true }
        department_id: { type: integer, nullable: true }
        team_id: { type: integer, nullable: true }
        customer_id: { type: integer, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        depends_on:
          type: array
          items: { type: integer }
        checklist: { type: array, items: { type: object } }
        requires_approval: { type: boolean }

    WorkLogCreateRequest:
      type: object
      properties:
        ticket_id: { type: integer, nullable: true }
        task_id: { type: integer, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        duration_minutes: { type: integer, minimum: 0, nullable: true }
        work_type: { type: string, nullable: true }
        internal_note: { type: string, nullable: true }
        customer_visible_note: { type: string, nullable: true }
        body: { type: string, nullable: true }
        department_id: { type: integer, nullable: true }
        result: { type: string, nullable: true }
        follow_up_required: { type: boolean }

    InstallationCreateRequest:
      type: object
      required: [branch_id]
      properties:
        branch_id: { type: integer }
        customer_id: { type: integer, nullable: true }
        prospect_name: { type: string, nullable: true }
        contact_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        gps_lat: { type: number, nullable: true }
        gps_lng: { type: number, nullable: true }
        requested_package: { type: string, nullable: true }
        requested_date: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        template_code: { type: string, nullable: true }
        expand_template: { type: boolean }

