        - not_home
        - no_answer
        - phone_unreachable
        - wrong_address
        - customer_moved
        - refused
        - disputed_balance
        - promise_to_pay
        - requested_manager
        - requested_cancellation
        - requested_review
        - business_closed
        - follow_up
        - other

    VisitOutcome:
      type: object
      properties:
