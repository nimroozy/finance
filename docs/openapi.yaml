    get:
      tags: [Audit]
      summary: List audit logs
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings:
    get:
      tags: [Settings]
      summary: Get company settings
      operationId: getSettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompanySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Settings]
      summary: Update company settings
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySettings'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/status:
    get:
      tags: [Zoho]
      summary: Zoho connection status
      operationId: zohoStatus
      responses:
        '200':
          description: Connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/health:
    get:
      tags: [Zoho]
      summary: Zoho sync health (heartbeats, cursors, circuit breakers)
      operationId: zohoHealth
      responses:
        '200':
          description: Health payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/locations:
    get:
      tags: [Zoho]
      summary: List synced Zoho locations
      operationId: zohoLocations
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/location-mapping-review:
    get:
      tags: [Zoho]
      summary: Review location mappings, usage counts, and candidates
      operationId: zohoLocationMappingReview
      responses:
        '200':
          description: Location mapping review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/mapping-conflicts:
    get:
      tags: [Zoho]
      summary: List customers invoiced across multiple Zoho locations
      operationId: zohoMappingConflicts
      responses:
        '200':
          description: Mapping conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/locations/{zohoId}/mapping-decision:
    post:
      tags: [Zoho]
      summary: Confirm a location mapping decision
      operationId: zohoLocationMappingDecision
      parameters:
        - name: zohoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, confirmed]
              properties:
                action:
                  type: string
                  enum: [import_branch, link_existing, ignore, defer, non_operational]
                branch_id: { type: integer, nullable: true }
                confirmed: { type: boolean }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Decision stored and mapping applied when applicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/locations/{zohoId}/reprocess:
    post:
      tags: [Zoho]
      summary: Reprocess invoices and customers for a mapped location
      operationId: zohoLocationReprocess
      parameters:
        - name: zohoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean }
                limit: { type: integer, minimum: 1, maximum: 5000 }
      responses:
        '200':
          description: Before/after counts and reprocessing statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/reporting-tags:
    get:
      tags: [Zoho]
      summary: List synced reporting tags with options
      operationId: zohoReportingTags
      responses:
        '200':
          description: Reporting tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/payment-modes:
    get:
      tags: [Zoho]
      summary: List synced Zoho payment modes
      operationId: zohoPaymentModes
      responses:
        '200':
          description: Payment modes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/structure/sync:
    post:
      tags: [Zoho]
      summary: Queue organization structure sync
      operationId: zohoStructureSync
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/branch-mappings/preview-auto-match:
    post:
      tags: [Zoho]
      summary: Preview location auto-match classifications
      operationId: zohoPreviewAutoMatch
      responses:
        '200':
          description: Match preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/branch-mappings/apply-auto-match:
    post:
      tags: [Zoho]
      summary: Apply confirmed non-ambiguous auto-matches
      operationId: zohoApplyAutoMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
      responses:
        '200':
          description: Applied count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/branches/{id}/link-location:
    post:
      tags: [Zoho]
      summary: Link a local branch to a Zoho location
      operationId: zohoLinkBranchLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoho_location_id]
              properties:
                zoho_location_id:
                  type: string
      responses:
        '200':
          description: Updated branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/locations/{zohoId}/import-as-branch:
    post:
      tags: [Zoho]
      summary: Import a Zoho location as a new local branch
      operationId: zohoImportLocationAsBranch
      parameters:
        - name: zohoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Created branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/circuit-breakers/{type}/resume:
    post:
      tags: [Zoho]
      summary: Resume a paused Zoho sync circuit breaker
      operationId: zohoResumeCircuit
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Circuit resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/failed-jobs/cleanup:
    post:
      tags: [Zoho]
      summary: Dry-run or apply redundant Zoho failed-job cleanup
      operationId: zohoFailedJobsCleanup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                apply:
                  type: boolean
                only_timestamp:
                  type: boolean
      responses:
        '200':
          description: Cleanup report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/failed-jobs:
    get:
      tags: [Zoho]
      summary: List and classify remaining Laravel failed jobs
      operationId: zohoFailedJobs
      responses:
        '200':
          description: Paginated classified failed jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/failed-jobs/archive:
    post:
      tags: [Zoho]
      summary: Archive and delete reviewed stale non-financial jobs
      operationId: zohoFailedJobsArchive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean }
                ids:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: Archive report path and archived IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
