openapi: 3.0.3
info:
  title: Collection Management System API
  version: 1.9.1
  license:
    name: Proprietary
    url: https://finance.mns.af
  description: |
    Stage 10.4 adds acceptance-only verification endpoints (unavailable in production).

    Stage 1–5 APIs for the Finance Collection Management System (auth, RBAC,
    Zoho sync, customers/invoices/debtors, assignments, visits, routes,
    promises, notes, evidence, notifications, collectors, reports, payments,
    receipts, collector wallets, reversals, Zoho payment sync, cash handovers,
    branch cashboxes, and the Stage 6 WhatsApp Cloud API foundation).

    Stage 5.1 P0 adds Zoho sync health, organization structure (locations/tags/
    accounts/payment modes), circuit breakers, failed-job cleanup, and
    location-based branch mapping helpers. Stage 5.1 P1 adds mapping review,
    conflict resolution, failed-job archival, and role-aware dashboards.

    Stage 7 adds ticketing, departmental tasks, SLA/escalation, WhatsApp ticket
    intake, installation queue (not Stage 8 CRM), attachments, work logs, and
    operations dashboards/search/reports.

    **Response envelope:** all JSON responses use
    `{ success, data, meta?, message?, errors? }`.

    **Branch isolation:** branch IDs supplied by the client are not trusted for
    authorization. Accessible branches are resolved from the authenticated
    user's permissions and branch assignments. Query filters such as
    `branch_id` may narrow results within allowed branches only.

    **Collector isolation:** collectors may only access assignment-owned
    resources (assignments, visits, routes, promises, notes, evidence, payments)
    that belong to their collector profile, unless they hold broader manage/view
    permissions.

    **Payments (Stage 4):** local confirm-before-Zoho; confirmed payments are
    never deleted (use reversals); cash credits collector wallets; receipt
    numbers are issued only on confirm. Public receipt verification is
    available at `GET /verify-receipt/{token}` (rate limited).

    **Cash custody (Stage 5):** collectors submit cash handovers; approval
    debits the collector wallet and credits the branch cashbox. Rejected
    handovers never move money. Already-handed-over payments require custody
    review before reversal.
servers:
  - url: https://finance.mns.af/api/v1
    description: Production
  - url: /api/v1
    description: Relative (same origin)
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Branches
  - name: Roles
  - name: Audit
  - name: Settings
  - name: Zoho
  - name: Customers
  - name: Invoices
  - name: Debtors
  - name: Assignments
  - name: Visits
  - name: Routes
  - name: Promises
  - name: Notes
  - name: Evidence
  - name: Notifications
  - name: Collectors
  - name: Reports
  - name: Payments
  - name: Receipts
  - name: Wallets
  - name: Reversals
  - name: Mapping
  - name: Ownership
  - name: Custody
  - name: WhatsApp
  - name: Tickets
  - name: Tasks
  - name: Installations
  - name: SLA
  - name: Escalations
  - name: TicketIntake
  - name: WorkLogs
  - name: Attachments
  - name: Operations
  - name: Departments
  - name: TaskTemplates
  - name: CRM
  - name: Inventory
    description: Stage 9 inventory, assets, sites
  - name: Services
    description: Stage 10 ISP service lifecycle (no Radius)
  - name: Acceptance
    description: Stage 10.4 acceptance-only verification (404 in production)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthData'
        '503':
          description: Service degraded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthData'

  /acceptance/ping:
    get:
      tags: [Acceptance]
      summary: Acceptance environment ping
      security: []
      operationId: acceptancePing
      description: Returns 404 unless APP_ENV is acceptance, testing, or local.
      responses:
        '200': { description: Acceptance environment metadata }
        '404': { description: Not available in this environment }

  /acceptance/assert:
    post:
      tags: [Acceptance]
      summary: Assert acceptance database record
      security: []
      operationId: acceptanceAssert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity, key, value]
              properties:
                entity: { type: string, enum: [customer, lead, service, user, audit] }
                key: { type: string }
                value: {}
                expect: { type: object, additionalProperties: true }
      responses:
        '200': { description: Assertion passed }
        '422': { description: Assertion failed }
        '404': { description: Not available in this environment }

  /acceptance/stock-reconciliation:
    get:
      tags: [Acceptance]
      summary: Inventory stock ledger reconciliation
      security: []
      operationId: acceptanceStockReconciliation
      responses:
        '200': { description: Ledger identity ok }
        '422': { description: Ledger mismatch }
        '404': { description: Not available in this environment }

  /acceptance/fixtures:
    get:
      tags: [Acceptance]
      summary: Acceptance fixture counts
      security: []
      operationId: acceptanceFixtures
      responses:
        '200': { description: Fixture summary }
        '404': { description: Not available in this environment }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponseData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          description: Account temporarily locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke current token)
      operationId: authLogout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      operationId: authMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      description: Invalidates all existing tokens after a successful change.
      operationId: authChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get user
      operationId: getUser
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user}/disable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Disable user
      operationId: disableUser
      responses:
        '200':
          description: User disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /branches:
    get:
      tags: [Branches]
      summary: List branches
      operationId: listBranches
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Branches]
      summary: Create branch
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name_en]
              properties:
                code: { type: string }
                name_en: { type: string }
                name_fa: { type: string }
                is_active: { type: boolean }
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /branches/{branch}:
    parameters:
      - name: branch
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Branches]
      summary: Get branch
      operationId: getBranch
      responses:
        '200':
          description: Branch detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Branches]
      summary: Update branch
      operationId: updateBranch
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                name_en: { type: string }
                name_fa: { type: string }
                is_active: { type: boolean }
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /roles:
    get:
      tags: [Roles]
      summary: List roles
      operationId: listRoles
      responses:
        '200':
          description: Roles list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings:
    get:
      tags: [Settings]
      summary: Get company settings
      operationId: getSettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompanySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Settings]
      summary: Update company settings
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySettings'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/status:
    get:
      tags: [Zoho]
      summary: Zoho connection status
      operationId: zohoStatus
      responses:
        '200':
          description: Connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/health:
    get:
      tags: [Zoho]
      summary: Zoho sync health (heartbeats, cursors, circuit breakers)
      operationId: zohoHealth
      responses:
        '200':
          description: Health payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/locations:
    get:
      tags: [Zoho]
      summary: List synced Zoho locations
      operationId: zohoLocations
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/location-mapping-review:
    get:
      tags: [Zoho]
      summary: Review location mappings, usage counts, and candidates
      operationId: zohoLocationMappingReview
      responses:
        '200':
          description: Location mapping review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/mapping-conflicts:
    get:
      tags: [Zoho]
      summary: List customers invoiced across multiple Zoho locations
      operationId: zohoMappingConflicts
      responses:
        '200':
          description: Mapping conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/locations/{zohoId}/mapping-decision:
    post:
      tags: [Zoho]
      summary: Confirm a location mapping decision
      operationId: zohoLocationMappingDecision
      parameters:
        - name: zohoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, confirmed]
              properties:
                action:
                  type: string
                  enum: [import_branch, link_existing, ignore, defer, non_operational]
                branch_id: { type: integer, nullable: true }
                confirmed: { type: boolean }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Decision stored and mapping applied when applicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/locations/{zohoId}/reprocess:
    post:
      tags: [Zoho]
      summary: Reprocess invoices and customers for a mapped location
      operationId: zohoLocationReprocess
      parameters:
        - name: zohoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean }
                limit: { type: integer, minimum: 1, maximum: 5000 }
      responses:
        '200':
          description: Before/after counts and reprocessing statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/reporting-tags:
    get:
      tags: [Zoho]
      summary: List synced reporting tags with options
      operationId: zohoReportingTags
      responses:
        '200':
          description: Reporting tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/payment-modes:
    get:
      tags: [Zoho]
      summary: List synced Zoho payment modes
      operationId: zohoPaymentModes
      responses:
        '200':
          description: Payment modes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/structure/sync:
    post:
      tags: [Zoho]
      summary: Queue organization structure sync
      operationId: zohoStructureSync
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/branch-mappings/preview-auto-match:
    post:
      tags: [Zoho]
      summary: Preview location auto-match classifications
      operationId: zohoPreviewAutoMatch
      responses:
        '200':
          description: Match preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/branch-mappings/apply-auto-match:
    post:
      tags: [Zoho]
      summary: Apply confirmed non-ambiguous auto-matches
      operationId: zohoApplyAutoMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
      responses:
        '200':
          description: Applied count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/branches/{id}/link-location:
    post:
      tags: [Zoho]
      summary: Link a local branch to a Zoho location
      operationId: zohoLinkBranchLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoho_location_id]
              properties:
                zoho_location_id:
                  type: string
      responses:
        '200':
          description: Updated branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /zoho/locations/{zohoId}/import-as-branch:
    post:
      tags: [Zoho]
      summary: Import a Zoho location as a new local branch
      operationId: zohoImportLocationAsBranch
      parameters:
        - name: zohoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Created branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/circuit-breakers/{type}/resume:
    post:
      tags: [Zoho]
      summary: Resume a paused Zoho sync circuit breaker
      operationId: zohoResumeCircuit
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Circuit resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/failed-jobs/cleanup:
    post:
      tags: [Zoho]
      summary: Dry-run or apply redundant Zoho failed-job cleanup
      operationId: zohoFailedJobsCleanup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                apply:
