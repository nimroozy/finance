        '200':
          description: Cleanup report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/failed-jobs:
    get:
      tags: [Zoho]
      summary: List and classify remaining Laravel failed jobs
      operationId: zohoFailedJobs
      responses:
        '200':
          description: Paginated classified failed jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /zoho/failed-jobs/archive:
    post:
      tags: [Zoho]
      summary: Archive and delete reviewed stale non-financial jobs
      operationId: zohoFailedJobsArchive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean }
                ids:
                  type: array
                  items: { type: integer }
