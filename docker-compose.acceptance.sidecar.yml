# Low-memory acceptance sidecar for the production VPS.
# Reuses the existing collection-system postgres + redis containers (separate DB + Redis DB index).
# Does NOT share application volumes with production storage.
#
# Prerequisites:
#   - collection-system network exists
#   - database collection_acceptance created on production postgres
#   - .env.acceptance present with DB_HOST=postgres, REDIS_HOST=redis, REDIS_DB=2
#
# Usage:
#   docker compose -f docker-compose.acceptance.sidecar.yml --env-file .env.acceptance up -d --build

name: collection-acceptance

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${ACCEPTANCE_NGINX_HTTP_PORT:-18080}:80"
    volumes:
      - ./docker/nginx/acceptance.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - acceptance
      - collection
    deploy:
      resources:
        limits:
          memory: 64M

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://127.0.0.1:18080}
        NEXT_PUBLIC_APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
      FRONTEND_BUILD_ID: ${FRONTEND_BUILD_ID:-${APP_COMMIT_SHA:-}}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - acceptance
    deploy:
      resources:
        limits:
          memory: 384M

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.acceptance
    environment:
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: "false"
      APP_ENV: acceptance
      DB_HOST: postgres
      DB_DATABASE: collection_acceptance
      REDIS_HOST: redis
      CACHE_PREFIX: collection_acceptance
      QUEUE_CONNECTION: redis
      E2E_ACCEPTANCE: "1"
      WHATSAPP_SEND_ENABLED: "false"
      RADIUS_ENABLED: "false"
      APP_STAGE: 10.4-production-acceptance-closure
    volumes:
      - acceptance_sidecar_storage:/var/www/html/storage/app
      - acceptance_sidecar_logs:/var/www/html/storage/logs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - acceptance
      - collection
    deploy:
      resources:
        limits:
          memory: 512M

  queue-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=collection_acceptance,default", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env.acceptance
    environment:
      CONTAINER_ROLE: worker
      RUN_MIGRATIONS: "false"
      APP_ENV: acceptance
      DB_HOST: postgres
      DB_DATABASE: collection_acceptance
      REDIS_HOST: redis
      CACHE_PREFIX: collection_acceptance
      WHATSAPP_SEND_ENABLED: "false"
      RADIUS_ENABLED: "false"
    volumes:
      - acceptance_sidecar_storage:/var/www/html/storage/app
      - acceptance_sidecar_logs:/var/www/html/storage/logs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - acceptance
      - collection
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  acceptance_sidecar_storage:
  acceptance_sidecar_logs:

networks:
  acceptance:
    driver: bridge
    name: collection-acceptance-net
  collection:
    external: true
    name: collection-system_collection
